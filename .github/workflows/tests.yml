name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # macOS runs the suite in about 15 minutes, past the old limit
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make sure jq is installed
        run: |
          if command -v jq > /dev/null 2>&1; then exit 0; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; else sudo apt-get install -y -q jq; fi

      - name: Show the tool versions
        run: |
          bash --version | head -1
          git --version
          jq --version

      - name: Run the Python unit tests and the fixture drive
        run: python3 -m unittest discover -s tests/py

      - name: Run the tests
        run: bash tests/run.sh

  windows:
    name: windows with python
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show the tool versions
        shell: bash
        run: |
          python --version
          git --version

      - name: Run the Python unit tests and the fixture drive
        run: python -m unittest discover -s tests/py -v

  package:
    name: package on ${{ matrix.os }} with python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9 build for setup-python
            python: "3.9"
          - os: ubuntu-latest
            python: "3.x"
          - os: macos-latest
            python: "3.x"
          - os: windows-latest
            python: "3.x"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the build tool
        run: python -m pip install build

      - name: Build the wheel and the sdist
        run: python -m build --outdir dist

      - name: Install the wheel in a fresh virtual environment and run it
        run: python tests/package_smoke.py dist

  forkboard:
    name: forkboard on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Forkboard's unit tests
        run: python -m unittest discover -s packages/forkboard/tests -v

      - name: Build Forkboard, install it in a fresh virtual environment and run it
        run: |
          python -m pip install build
          python packages/forkboard/tests/package_smoke.py

  forkboard-browser:
    name: forkboard in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/forkboard/tests/browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Drive the page in Chromium
        run: npm test
