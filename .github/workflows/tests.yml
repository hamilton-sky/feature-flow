name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is this pull request only docs?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # a push to main always runs everything; a pull request that changes only docs/, README.md,
          # CONTRIBUTING.md or LICENSE runs the docs check alone. guides/ and skills/ are code: agents read them
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          other="$(git diff --name-only "$BASE...$HEAD" | grep -vE '^(docs/|README\.md$|CONTRIBUTING\.md$|LICENSE$)' || true)"
          if [ -n "$other" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          echo "files outside the docs: ${other:-none}"

  docs:
    name: docs only
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests that read the README and the docs
        run: python3 -m unittest discover -s tests/py -p "test_profiles.py"

  unit:
    name: unit ${{ matrix.os }} ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Show the tool versions
        shell: bash
        run: |
          python --version
          git --version

      - name: Run this shard of the Python unit tests and the fixture drive
        run: python tests/shard.py ${{ matrix.shard }} 4 -v

  scripts:
    name: scripts ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make sure jq is installed
        run: |
          if command -v jq > /dev/null 2>&1; then exit 0; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install jq; else sudo apt-get install -y -q jq; fi

      - name: Show the tool versions
        run: |
          bash --version | head -1
          git --version
          jq --version

      - name: Run the tests (the unit tests run in their own shards)
        env:
          FLOW_UNIT_IN_SHARDS: "1"
        run: bash tests/run.sh

  package:
    name: package on ${{ matrix.os }} with python ${{ matrix.python }}
    if: github.event_name == 'push'  # main only; a version tag builds and smoke-tests the wheel in release.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9 build for setup-python
            python: "3.9"
          - os: ubuntu-latest
            python: "3.x"
          - os: macos-latest
            python: "3.x"
          - os: windows-latest
            python: "3.x"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the build tool
        run: python -m pip install build

      - name: Build the wheel and the sdist
        run: python -m build --outdir dist

      - name: Install the wheel in a fresh virtual environment and run it
        run: python tests/package_smoke.py dist

  forkboard:
    name: forkboard on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Forkboard's unit tests
        run: python -m unittest discover -s packages/forkboard/tests -v

      - name: Build Forkboard, install it in a fresh virtual environment and run it
        run: |
          python -m pip install build
          python packages/forkboard/tests/package_smoke.py

  forkboard-browser:
    name: forkboard in a browser
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/forkboard/tests/browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Drive the page in Chromium
        run: npm test
