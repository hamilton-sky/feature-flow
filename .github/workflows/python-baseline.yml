name: python baseline (temporary, ticket 01)

on:
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Report python and git
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $ImageOS $ImageVersion"
          python3 --version || true
          python --version || true
          command -v git && git --version || echo "git: not on PATH"
