[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-flow"
dynamic = ["version"]
description = "A ticket-graph workflow for coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
feature-flow = "feature_flow.cli:main"

[tool.setuptools]
packages = ["feature_flow"]

[tool.setuptools.dynamic]
version = { attr = "feature_flow.__version__" }
