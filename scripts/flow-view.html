<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--__REFRESH__-->
<title>Ticket flow</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c232c; --line: #30363d; --text: #e6edf3; --muted: #8b949e;
  --resolved: #3fb950; --ready: #f0b429; --claimed: #58a6ff; --open: #8b949e; --waiting: #f85149; --parked: #6e7681;
  --danger: #f85149; --card: #1b222b; --shadow: 0 8px 28px rgba(0, 0, 0, .45);
}
:root[data-theme="light"] {
  --bg: #ffffff; --panel: #f6f8fa; --panel2: #eef1f4; --line: #d0d7de; --text: #1f2328; --muted: #656d76;
  --resolved: #1a7f37; --ready: #bf8700; --claimed: #0969da; --open: #6e7781; --waiting: #cf222e; --parked: #8c959f;
  --danger: #cf222e; --card: #ffffff; --shadow: 0 8px 24px rgba(31, 35, 40, .15);
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --bg: #ffffff; --panel: #f6f8fa; --panel2: #eef1f4; --line: #d0d7de; --text: #1f2328; --muted: #656d76;
    --resolved: #1a7f37; --ready: #bf8700; --claimed: #0969da; --open: #6e7781; --waiting: #cf222e; --parked: #8c959f;
    --danger: #cf222e; --card: #ffffff; --shadow: 0 8px 24px rgba(31, 35, 40, .15);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; min-height: 100vh;
}
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .2px; }
header .sub { color: var(--muted); font-size: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; background: var(--panel2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
button, select {
  font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible, .node:focus-visible { outline: 2px solid var(--claimed); outline-offset: 2px; }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
#stage { overflow: auto; padding: 16px; position: relative; display: flex; align-items: center; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; background-position: -11px -11px; }
#graph { display: block; margin: 0 auto; max-width: none; flex: 0 0 auto; }
#graph.fit { width: 100%; height: auto; }
aside { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; overflow: auto; }
aside h2 { margin: 0 0 4px; font-size: 15px; }
aside .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
aside h3 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
aside ul { margin: 0; padding-left: 18px; }
aside li { margin: 2px 0; }
aside pre { white-space: pre-wrap; word-break: break-word; margin: 0; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
aside .empty { color: var(--muted); }
footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
#scrub { flex: 1 1 220px; min-width: 160px; accent-color: var(--resolved); }
#clock { color: var(--muted); font-size: 12px; min-width: 190px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 12px; width: 100%; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* graph */
.edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
.edge.done { stroke: var(--resolved); opacity: .55; }
.edge.active { stroke: var(--ready); stroke-width: 2.2; stroke-dasharray: 7 9; animation: flow .9s linear infinite; }
.edge.hot { stroke: var(--text); opacity: 1; stroke-width: 2.4; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.card { fill: var(--card); stroke: var(--line); stroke-width: 1.4; transition: stroke .3s, fill .3s; }
.node { cursor: pointer; }
.node .t { fill: var(--text); font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; }
.node .l { fill: var(--muted); font: 600 11px ui-monospace, Menlo, monospace; }
.node .sub { fill: var(--muted); font: 11px -apple-system, "Segoe UI", Roboto, sans-serif; }
.node .badge { font: 700 11px -apple-system, "Segoe UI", sans-serif; }
.node.st-resolved .card { stroke: var(--resolved); }
.node.st-claimed .card { stroke: var(--claimed); }
.node.st-waiting .card { stroke: var(--waiting); }
.node.st-parked .card { stroke: var(--parked); stroke-dasharray: 5 4; }
.node.ready .card { stroke: var(--ready); }
.node.pinned .card, .node:hover .card { stroke-width: 2.6; }
.stripe.st-resolved { fill: var(--resolved); } .stripe.st-ready { fill: var(--ready); } .stripe.st-claimed { fill: var(--claimed); }
.stripe.st-open { fill: var(--open); } .stripe.st-waiting { fill: var(--waiting); } .stripe.st-parked { fill: var(--parked); }
.ring { fill: none; stroke: var(--ready); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; pointer-events: none; }
.node.ready .ring { animation: pulse 1.9s ease-out infinite; }
@keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.14, 1.34); } }
.spin { fill: none; stroke: var(--claimed); stroke-width: 2.2; stroke-dasharray: 5 4; transform-box: fill-box; transform-origin: center; opacity: 0; }
.node.st-claimed .spin { opacity: 1; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.burst { fill: none; stroke: var(--resolved); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; pointer-events: none; }
.burst.go { animation: burst .9s ease-out 1; }
@keyframes burst { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.22, 1.7); } }
.node.sentback .card { animation: flash .9s ease-in-out 2; }
@keyframes flash { 0%, 100% { stroke: var(--danger); fill: var(--card); } 50% { stroke: var(--danger); fill: rgba(248, 81, 73, .25); } }
.traveller { fill: var(--resolved); filter: drop-shadow(0 0 4px var(--resolved)); pointer-events: none; }
.empty-msg { text-align: center; color: var(--muted); padding: 60px 20px; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } .stats { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1 id="feat">Ticket flow</h1>
  <span class="sub" id="sub"></span>
  <div class="stats" id="stats"></div>
  <button id="fit" title="Switch between fit to window and full size">Fit</button>
  <button id="theme" title="Switch light and dark (t)">Theme</button>
</header>
<main>
  <div id="stage"><svg id="graph" class="fit" role="img" aria-label="Ticket dependency graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="detail" aria-live="polite"><p class="empty">Hover or click a ticket to see its details.</p></aside>
</main>
<footer>
  <button id="restart" title="Back to the start (Home)">&#9198;</button>
  <button id="play" title="Play or pause the replay (space)">&#9654; Replay</button>
  <button id="stepb" title="Previous step (left arrow)">&#9664;</button>
  <button id="stepf" title="Next step (right arrow)">&#9654;</button>
  <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Replay position">
  <select id="speed" aria-label="Replay speed"><option value="2">0.5x</option><option value="1" selected>1x</option><option value="0.5">2x</option><option value="0.25">4x</option></select>
  <button id="now" title="Show the current state (End)">Now</button>
  <span id="clock"></span>
  <div class="legend" id="legend"></div>
</footer>
<script id="flow-data" type="application/json">__FLOW_DATA__</script>
<script>
"use strict";

// <layout>
function layoutGraph(tickets, o) {
  var byLabel = {};
  tickets.forEach(function (t) { byLabel[t.label] = t; });
  var layer = {}, visiting = {};
  function depth(t) {
    if (layer[t.label] !== undefined) return layer[t.label];
    if (visiting[t.label]) return 0;
    visiting[t.label] = true;
    var d = 0;
    t.blocked_by.forEach(function (b) { if (byLabel[b]) d = Math.max(d, depth(byLabel[b]) + 1); });
    visiting[t.label] = false;
    layer[t.label] = d;
    return d;
  }
  tickets.forEach(depth);
  var maxLayer = 0;
  tickets.forEach(function (t) { maxLayer = Math.max(maxLayer, layer[t.label]); });
  var cols = [], c;
  for (c = 0; c <= maxLayer; c++) cols.push([]);
  tickets.forEach(function (t) { cols[layer[t.label]].push(t.label); });
  var succ = {};
  tickets.forEach(function (t) {
    t.blocked_by.forEach(function (b) { if (byLabel[b]) (succ[b] = succ[b] || []).push(t.label); });
  });
  var pos = {};
  function index() { cols.forEach(function (col) { col.forEach(function (l, i) { pos[l] = i; }); }); }
  function avg(list, fallback) {
    if (!list.length) return fallback;
    return list.reduce(function (a, l) { return a + pos[l]; }, 0) / list.length;
  }
  function byBary(fn) {
    return function (a, b) { return (fn(a) - fn(b)) || (byLabel[a].id - byLabel[b].id); };
  }
  index();
  for (var sweep = 0; sweep < 4; sweep++) {
    for (c = 1; c <= maxLayer; c++) {
      cols[c].sort(byBary(function (l) { return avg(byLabel[l].blocked_by.filter(function (b) { return byLabel[b]; }), pos[l]); }));
      index();
    }
    for (c = maxLayer - 1; c >= 0; c--) {
      cols[c].sort(byBary(function (l) { return avg(succ[l] || [], pos[l]); }));
      index();
    }
  }
  var tallest = 0;
  cols.forEach(function (col) { tallest = Math.max(tallest, col.length); });
  var colH = function (n) { return n * o.nodeH + Math.max(0, n - 1) * o.rowGap; };
  var innerH = colH(tallest);
  var nodes = {};
  cols.forEach(function (col, ci) {
    var y0 = o.pad + (innerH - colH(col.length)) / 2;
    col.forEach(function (l, i) {
      nodes[l] = { x: o.pad + ci * (o.nodeW + o.colGap), y: y0 + i * (o.nodeH + o.rowGap), layer: ci };
    });
  });
  var edges = [];
  tickets.forEach(function (t) {
    t.blocked_by.forEach(function (b) { if (byLabel[b]) edges.push({ from: b, to: t.label }); });
  });
  return {
    nodes: nodes, edges: edges,
    width: o.pad * 2 + (maxLayer + 1) * o.nodeW + maxLayer * o.colGap,
    height: o.pad * 2 + innerH
  };
}
// </layout>

// <replay>
function readyOf(tickets, state) {
  var r = {};
  tickets.forEach(function (t) {
    r[t.label] = state[t.label] === "open" && t.blocked_by.every(function (b) { return state[b] === "resolved"; });
  });
  return r;
}

function buildFrames(tickets, details) {
  var events = [];
  tickets.forEach(function (t) {
    var h = (details[t.label] && details[t.label].history) || [];
    h.forEach(function (e, i) { events.push({ t: e.t, label: t.label, status: e.status, first: i === 0 }); });
  });
  events.sort(function (a, b) { return (a.t - b.t) || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0); });
  var state = {};
  tickets.forEach(function (t) { state[t.label] = "open"; });
  events.forEach(function (e) { if (e.first) state[e.label] = e.status; });
  var copy = function (s) { var o = {}; Object.keys(s).forEach(function (k) { o[k] = s[k]; }); return o; };
  var frames = [{ t: events.length ? events[0].t : null, state: copy(state), change: null }];
  events.forEach(function (e) {
    if (e.first || state[e.label] === e.status) return;
    var from = state[e.label];
    state[e.label] = e.status;
    frames.push({ t: e.t, state: copy(state), change: { label: e.label, from: from, to: e.status } });
  });
  return frames;
}
// </replay>

(function () {
  var NS = "http://www.w3.org/2000/svg";
  var data = JSON.parse(document.getElementById("flow-data").textContent);
  var tickets = data.tickets || [];
  var details = data.details || {};
  var O = { nodeW: 214, nodeH: 66, colGap: 96, rowGap: 24, pad: 36 };
  var STATUS_COLOR = { resolved: "var(--resolved)", ready: "var(--ready)", claimed: "var(--claimed)", open: "var(--open)", waiting: "var(--waiting)", parked: "var(--parked)", unknown: "var(--open)" };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function h(tag, attrs, text) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function ellipsize(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  $("feat").textContent = data.feature ? "Ticket flow: " + data.feature : "Ticket flow";
  $("sub").textContent = data.generated ? "generated " + data.generated : "";
  document.title = $("feat").textContent;

  var legend = $("legend");
  [["resolved", "resolved"], ["ready", "ready to start"], ["claimed", "being worked"], ["open", "waiting on a blocker"], ["waiting", "needs a human"], ["parked", "parked"]].forEach(function (p) {
    var s = h("span");
    var d = h("i", { "class": "dot" }); d.style.background = STATUS_COLOR[p[0]];
    s.appendChild(d); s.appendChild(document.createTextNode(p[1]));
    legend.appendChild(s);
  });
  legend.appendChild(h("span", {}, "dashes flow into tickets that are ready to start"));

  var svg = $("graph");
  if (!tickets.length) {
    $("stage").replaceChildren(h("p", { "class": "empty-msg" }, "No tickets found."));
    return;
  }
  var L = layoutGraph(tickets, O);
  svg.setAttribute("viewBox", "0 0 " + L.width + " " + L.height);
  svg.setAttribute("width", L.width);
  svg.setAttribute("height", L.height);
  var defs = el("defs");
  svg.appendChild(defs);
  var edgeLayer = el("g"), nodeLayer = el("g"), fxLayer = el("g");
  svg.appendChild(edgeLayer); svg.appendChild(nodeLayer); svg.appendChild(fxLayer);

  var edgeEls = {};
  L.edges.forEach(function (e) {
    var a = L.nodes[e.from], b = L.nodes[e.to];
    var x1 = a.x + O.nodeW, y1 = a.y + O.nodeH / 2, x2 = b.x, y2 = b.y + O.nodeH / 2, dx = Math.max(40, (x2 - x1) / 2);
    var path = el("path", { "class": "edge", d: "M" + x1 + "," + y1 + " C" + (x1 + dx) + "," + y1 + " " + (x2 - dx) + "," + y2 + " " + x2 + "," + y2 });
    edgeLayer.appendChild(path);
    edgeEls[e.from + ">" + e.to] = path;
  });

  var byLabel = {}, nodeEls = {};
  tickets.forEach(function (t) { byLabel[t.label] = t; });
  tickets.forEach(function (t) {
    var p = L.nodes[t.label];
    var g = el("g", { "class": "node", transform: "translate(" + p.x + "," + p.y + ")", tabindex: "0", role: "button" });
    g.appendChild(el("title", {}, t.label + " " + t.title));
    g.appendChild(el("rect", { "class": "ring", width: O.nodeW, height: O.nodeH, rx: 12 }));
    g.appendChild(el("rect", { "class": "card", width: O.nodeW, height: O.nodeH, rx: 12 }));
    var stripe = el("rect", { "class": "stripe", x: 0, y: 10, width: 4, height: O.nodeH - 20, rx: 2 });
    g.appendChild(stripe);
    g.appendChild(el("rect", { "class": "spin", x: O.nodeW - 24, y: 8, width: 16, height: 16, rx: 8 }));
    g.appendChild(el("rect", { "class": "burst", width: O.nodeW, height: O.nodeH, rx: 12 }));
    g.appendChild(el("text", { "class": "l", x: 16, y: 22 }, t.label + (t.type && t.type !== "task" ? "  ·  " + t.type : "")));
    g.appendChild(el("text", { "class": "t", x: 16, y: 43 }, ellipsize(t.title, 27)));
    var d = details[t.label] || {};
    var sub = el("text", { "class": "sub", x: 16, y: 58 }, "");
    g.appendChild(sub);
    var rounds = el("text", { "class": "badge", x: O.nodeW - 14, y: 22, "text-anchor": "end" }, "");
    g.appendChild(rounds);
    if (d.rounds && d.rounds.length) { rounds.textContent = "⟳ " + d.rounds.length; rounds.style.fill = "var(--ready)"; }
    nodeLayer.appendChild(g);
    nodeEls[t.label] = { g: g, stripe: stripe, sub: sub, burst: g.querySelector(".burst") };
    g.addEventListener("mouseenter", function () { if (!pinned) showDetail(t.label); });
    g.addEventListener("mouseleave", function () { if (!pinned) showDetail(null); });
    g.addEventListener("focus", function () { if (!pinned) showDetail(t.label); });
    g.addEventListener("click", function (ev) { ev.stopPropagation(); pinned = pinned === t.label ? null : t.label; showDetail(pinned || t.label); markPinned(); });
    g.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); g.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
  });
  var pinned = null;
  function markPinned() { Object.keys(nodeEls).forEach(function (k) { nodeEls[k].g.classList.toggle("pinned", k === pinned); }); }
  $("stage").addEventListener("click", function () { pinned = null; showDetail(null); markPinned(); });

  var SUBTEXT = { resolved: "resolved", ready: "ready to start", claimed: "being worked on", open: "waiting on a blocker", waiting: "needs a human", parked: "parked", unknown: "unknown status" };

  // The state being shown: { label: status } plus the ready flags for it.
  var shown = { state: {}, ready: {} };
  function nowState() {
    var s = {}, r = {};
    tickets.forEach(function (t) { s[t.label] = t.status; r[t.label] = !!t.ready; });
    return { state: s, ready: r };
  }
  function apply(view, label) {
    shown = view;
    tickets.forEach(function (t) {
      var st = view.state[t.label], rd = view.ready[t.label];
      var n = nodeEls[t.label];
      n.g.setAttribute("class", "node st-" + st + (rd ? " ready" : "") + (pinned === t.label ? " pinned" : ""));
      var stripeKey = rd ? "ready" : st;
      n.stripe.setAttribute("class", "stripe st-" + stripeKey);
      n.sub.textContent = rd ? SUBTEXT.ready : (SUBTEXT[st] || st);
      n.g.setAttribute("aria-label", t.label + " " + t.title + ", " + (rd ? SUBTEXT.ready : (SUBTEXT[st] || st)));
    });
    L.edges.forEach(function (e) {
      var from = view.state[e.from], to = view.state[e.to];
      var cls = "edge";
      if (from === "resolved" && to === "resolved") cls += " done";
      else if (from === "resolved" && (view.ready[e.to] || to === "claimed")) cls += " active";
      edgeEls[e.from + ">" + e.to].setAttribute("class", cls);
    });
    renderStats(view);
    if (currentDetail) showDetail(currentDetail);
  }

  function renderStats(view) {
    var count = { resolved: 0, claimed: 0, ready: 0 };
    tickets.forEach(function (t) {
      if (view.state[t.label] === "resolved") count.resolved++;
      if (view.state[t.label] === "claimed") count.claimed++;
      if (view.ready[t.label]) count.ready++;
    });
    var stats = $("stats");
    stats.replaceChildren();
    function chip(color, text) {
      var c = h("span", { "class": "chip" });
      if (color) { var d = h("i", { "class": "dot" }); d.style.background = color; c.appendChild(d); }
      c.appendChild(document.createTextNode(text));
      stats.appendChild(c);
    }
    chip(STATUS_COLOR.resolved, count.resolved + " of " + tickets.length + " resolved");
    chip(STATUS_COLOR.ready, count.ready + " ready");
    if (count.claimed) chip(STATUS_COLOR.claimed, count.claimed + " in progress");
  }

  var currentDetail = null;
  function showDetail(label) {
    currentDetail = label;
    var box = $("detail");
    box.replaceChildren();
    if (!label) { box.appendChild(h("p", { "class": "empty" }, "Hover or click a ticket to see its details.")); return; }
    var t = byLabel[label], d = details[label] || {};
    var st = shown.state[label], rd = shown.ready[label];
    box.appendChild(h("h2", {}, t.label + "  " + t.title));
    box.appendChild(h("div", { "class": "meta" }, (t.type || "task") + " · " + (rd ? "ready to start" : (SUBTEXT[st] || st)) + (t.test_first ? " · test first: " + t.test_first : "")));
    if (t.blocked_by.length) {
      box.appendChild(h("h3", {}, "Blocked by"));
      var ul = h("ul");
      t.blocked_by.forEach(function (b) {
        var bt = byLabel[b];
        ul.appendChild(h("li", {}, b + (bt ? "  " + bt.title + "  (" + (shown.state[b] || bt.status) + ")" : "  (missing)")));
      });
      box.appendChild(ul);
    }
    if (d.done_when && d.done_when.length) {
      box.appendChild(h("h3", {}, "Done when"));
      var ul2 = h("ul");
      d.done_when.forEach(function (x) { ul2.appendChild(h("li", {}, x)); });
      box.appendChild(ul2);
    }
    if (d.rounds && d.rounds.length) {
      box.appendChild(h("h3", {}, "Sent back"));
      var ul3 = h("ul");
      d.rounds.forEach(function (r) { ul3.appendChild(h("li", {}, "round " + r.n + ": " + r.source)); });
      box.appendChild(ul3);
    }
    if (d.answer) {
      box.appendChild(h("h3", {}, "Answer"));
      box.appendChild(h("pre", {}, d.answer));
    }
  }

  // Replay.
  var frames = buildFrames(tickets, details);
  var hasHistory = frames.length > 1;
  var idx = frames.length - 1;
  var timer = null;
  var scrub = $("scrub");
  scrub.max = String(Math.max(0, frames.length - 1));

  function frameView(i) {
    var f = frames[i];
    return { state: f.state, ready: readyOf(tickets, f.state) };
  }
  function clockText(i) {
    if (!hasHistory) return "no git history for these tickets yet";
    var f = frames[i];
    var when = f.t ? new Date(f.t * 1000).toLocaleString() : "";
    return "step " + i + " of " + (frames.length - 1) + (when ? "  ·  " + when : "");
  }
  function seek(i, animate) {
    idx = Math.max(0, Math.min(frames.length - 1, i));
    scrub.value = String(idx);
    apply(frameView(idx));
    $("clock").textContent = clockText(idx);
    if (animate && frames[idx].change) transition(frames[idx].change);
    mode = "replay";
  }
  var mode = "now";
  function showNow() {
    pause();
    apply(nowState());
    scrub.value = scrub.max;
    $("clock").textContent = hasHistory ? "current state" : clockText(0);
    mode = "now";
  }

  function transition(ch) {
    if (reduce) return;
    var n = nodeEls[ch.label];
    if (!n) return;
    if (ch.to === "resolved") {
      n.burst.classList.remove("go"); void n.burst.getBoundingClientRect(); n.burst.classList.add("go");
      byLabel[ch.label].blocked_by.forEach(function (b) { var p = edgeEls[b + ">" + ch.label]; if (p) travel(p); });
    } else if (ch.from === "resolved") {
      n.g.classList.remove("sentback"); void n.g.getBoundingClientRect(); n.g.classList.add("sentback");
    }
  }
  function travel(path) {
    var len = path.getTotalLength(), dot = el("circle", { "class": "traveller", r: 5 });
    fxLayer.appendChild(dot);
    var start = null, dur = 650;
    function stepFn(ts) {
      if (start === null) start = ts;
      var k = Math.min(1, (ts - start) / dur), pt = path.getPointAtLength(len * k);
      dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
      if (k < 1) requestAnimationFrame(stepFn); else fxLayer.removeChild(dot);
    }
    requestAnimationFrame(stepFn);
  }

  function play() {
    if (!hasHistory) return;
    if (idx >= frames.length - 1) seek(0, false);
    $("play").textContent = "⏸ Pause";
    var speed = parseFloat($("speed").value);
    (function tick() {
      timer = setTimeout(function () {
        if (idx >= frames.length - 1) { pause(); return; }
        seek(idx + 1, true);
        tick();
      }, 1100 * speed);
    })();
  }
  function pause() { if (timer) clearTimeout(timer); timer = null; $("play").textContent = "▶ Replay"; }
  function toggle() { if (timer) pause(); else play(); }

  $("play").addEventListener("click", toggle);
  $("restart").addEventListener("click", function () { pause(); seek(0, false); });
  $("stepf").addEventListener("click", function () { pause(); seek(idx + 1, true); });
  $("stepb").addEventListener("click", function () { pause(); seek(idx - 1, false); });
  $("now").addEventListener("click", showNow);
  scrub.addEventListener("input", function () { pause(); seek(parseInt(scrub.value, 10), false); });
  $("speed").addEventListener("change", function () { if (timer) { pause(); play(); } });
  if (!hasHistory) { ["restart", "play", "stepb", "stepf", "scrub", "speed"].forEach(function (id) { $(id).disabled = true; }); }

  $("fit").addEventListener("click", function () {
    var fit = svg.classList.toggle("fit");
    $("fit").textContent = fit ? "Fit" : "Full size";
  });
  function setTheme(v) { document.documentElement.setAttribute("data-theme", v); try { localStorage.setItem("flow-theme", v); } catch (e) { } }
  try { var saved = localStorage.getItem("flow-theme"); if (saved) document.documentElement.setAttribute("data-theme", saved); } catch (e) { }
  $("theme").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur === "dark" || (cur === "auto" && !(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches));
    setTheme(dark ? "light" : "dark");
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT")) return;
    if (ev.key === " " || ev.key === "k") { ev.preventDefault(); toggle(); }
    else if (ev.key === "ArrowRight") { pause(); seek(idx + 1, true); }
    else if (ev.key === "ArrowLeft") { pause(); seek(idx - 1, false); }
    else if (ev.key === "Home") { pause(); seek(0, false); }
    else if (ev.key === "End") { showNow(); }
    else if (ev.key === "t") { $("theme").click(); }
  });

  function frontierX() {
    var best = null;
    tickets.forEach(function (t) {
      var interesting = shown.ready[t.label] || shown.state[t.label] === "claimed";
      if (interesting && (best === null || L.nodes[t.label].x < best)) best = L.nodes[t.label].x;
    });
    return best;
  }
  function chooseFit() {
    var stage = $("stage");
    var scale = (stage.clientWidth - 32) / L.width;
    var fit = scale >= 0.7;
    svg.classList.toggle("fit", fit);
    $("fit").textContent = fit ? "Fit" : "Full size";
    if (!fit) {
      var x = frontierX();
      stage.scrollLeft = x === null ? 0 : Math.max(0, x - stage.clientWidth / 3);
    }
  }

  window.__flow = { seek: seek, play: play, pause: pause, now: showNow, frames: frames, layout: L, count: tickets.length };
  showNow();
  chooseFit();
})();
</script>
</body>
</html>
